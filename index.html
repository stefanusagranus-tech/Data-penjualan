<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Semua Tabel Supabase</title>
    <style>
        /* Modern Reset & Dark Theme Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 80rem;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }
        .header-title p {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .btn-refresh {
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-refresh:hover {
            background-color: #6366f1;
        }
        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 500;
        }
        .badge-loading {
            background-color: rgba(234, 179, 8, 0.1);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.2);
        }
        .badge-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .badge-error {
            background-color: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }
        
        /* Table Cards Container */
        .tables-grid {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }
        .table-card {
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .table-card-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.3);
        }
        .table-card-header h3 {
            font-size: 1.125rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .row-count {
            font-family: monospace;
            font-size: 0.75rem;
            background-color: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }
        
        /* Table Styling */
        .table-wrapper {
            overflow-x: auto;
            max-height: 24rem;
        }
        table {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
        }
        th {
            background-color: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #1e293b;
            font-size: 0.75rem;
            font-family: monospace;
            color: #cbd5e1;
            white-space: nowrap;
            max-width: 20rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        tr:hover {
            background-color: rgba(51, 65, 85, 0.2);
        }
        .empty-row {
            text-align: center;
            padding: 2rem;
            color: #64748b;
        }
        .loading-text, .error-text {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
        .error-text {
            color: #fb7185;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>📊 Dashboard Seluruh Data Supabase</h1>
                <p>Monitoring & Baca Data Semua Tabel</p>
            </div>
            <div class="header-actions">
                <button onclick="loadAllData()" class="btn-refresh">Refresh Semua Data</button>
                <div id="api-status" class="badge badge-loading">Memeriksa...</div>
            </div>
        </header>

        <!-- Container untuk Semua Tabel -->
        <div id="tables-container" class="tables-grid">
            <div class="loading-text">Memuat seluruh data dari server...</div>
        </div>
    </div>

    <script>
        // Ganti dengan URL backend publikmu (misal dari fastapicloud.com)
        const API_BASE_URL = "https://data-penjualan.fastapicloud.dev";

        async function loadAllData() {
            const container = document.getElementById("tables-container");
            const statusBadge = document.getElementById("api-status");
            
            container.innerHTML = `<div class="loading-text">Sedang menarik data dari semua tabel...</div>`;

            try {
                const res = await fetch(`${API_BASE_URL}/api/all-tables`);
                const result = await res.json();

                if (result.status === "success") {
                    statusBadge.textContent = "API Terhubung 🟢";
                    statusBadge.className = "badge badge-success";
                    
                    container.innerHTML = "";
                    const tables = result.data;

                    // Render setiap tabel dari response backend
                    for (const [tableName, rows] of Object.entries(tables)) {
                        let tableHTML = `
                            <div class="table-card">
                                <div class="table-card-header">
                                    <h3>📂 Tabel: ${tableName}</h3>
                                    <span class="row-count">Total: ${rows.length} baris</span>
                                </div>
                                <div class="table-wrapper">
                                    <table>
                        `;

                        if (rows && rows.length > 0) {
                            const columns = Object.keys(rows[0]);
                            
                            tableHTML += `<thead><tr>`;
                            columns.forEach(col => {
                                tableHTML += `<th>${col}</th>`;
                            });
                            tableHTML += `</tr></thead><tbody>`;

                            rows.forEach(row => {
                                tableHTML += `<tr>`;
                                columns.forEach(col => {
                                    let val = row[col] !== null ? row[col] : "-";
                                    tableHTML += `<td>${val}</td>`;
                                });
                                tableHTML += `</tr>`;
                            });
                            tableHTML += `</tbody>`;
                        } else {
                            tableHTML += `<tbody><tr><td class="empty-row" colspan="100">Tabel ini masih kosong.</td></tr></tbody>`;
                        }

                        tableHTML += `</table></div></div>`;
                        container.innerHTML += tableHTML;
                    }
                }
            } catch (error) {
                statusBadge.textContent = "API Terputus 🔴";
                statusBadge.className = "badge badge-error";
                container.innerHTML = `<div class="error-text">Gagal memuat data. Periksa koneksi backend FastAPI.</div>`;
            }
        }

        loadAllData();
    </script>
</body>
</html>
